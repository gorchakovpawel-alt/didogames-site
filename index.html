<style>
/* ═══════════════════════════════════════════════════════════════════════════
   РАЗВОРОТ — оформление сайта студии Dido Games.

   Тезис. У студии две игры противоположной температуры: ледяная война машин и
   тёплый дом с котами. Это и есть её лицо. Главная — РАЗВОРОТ: два кадра во всю
   ширину, разделённые швом, и имя студии, набранное ПОВЕРХ шва: слева буквы
   светлые по ночи, справа тёмные по дню. Одно имя, два мира, разрез ровно там,
   где студия и разделена.

   Шрифт. Dido → Didone. Имя студии прямо указывает на класс гарнитуры с резким
   контрастом штриха, и заголовки набраны Oranienbaum — кириллическая дидона.
   Это не «серифный дефолт», это буквальное прочтение названия.
   ═══════════════════════════════════════════════════════════════════════════ */

:root{
  /* грунт студии — полночь с фиолетово-синим уходом: не сталь и не крем, но родня обоим */
  --void:#0B0D12; --void2:#12151C; --void3:#1A1E27;
  --bone:#F0EAE1; --bone2:#FBF7F1;
  --ash:#9AA3B0; --slate:#39404D; --hair:#242A34;
  --ink:#17151A;
  /* цвета сняты пипеткой с актуального арта игр */
  --ice:#8FD8E8;        /* свет фар и окон нового локомотива */
  --amber:#E9B43C;      /* предупредительная косая на корпусе */
  --lilac:#C8B6E2;      /* шерсть Лаванды */
  --moss:#6BE06B;       /* живой зелёный интерфейса «Поезда» */
  --disp:"Oranienbaum",Georgia,serif;
  --sans:"Sofia Sans",system-ui,-apple-system,sans-serif;
  --mono:"Martian Mono",ui-monospace,monospace;
  --w:1280px; --pad:clamp(20px,4vw,56px);
  --seam:50%;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--void)}
body{margin:0;overflow-x:clip;background:var(--void);color:var(--bone);
  font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400;line-height:.98;overflow-wrap:break-word}
p{margin:0}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}

.m{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;line-height:1.6}
.m--ice{color:var(--ice)}.m--dim{color:var(--ash)}
.dsp{font-family:var(--disp);font-weight:400;letter-spacing:.005em}

/* ══ шапка ══ */
.hd{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--void) 86%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--hair)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:18px}
.mark{display:flex;align-items:baseline;gap:9px;text-decoration:none;font-family:var(--disp);
  font-size:clamp(19px,4.6vw,23px);letter-spacing:.01em;color:var(--bone);white-space:nowrap}
.mark i{width:7px;height:7px;background:var(--wdot,var(--ice));border-radius:50%;transform:translateY(-3px);transition:background .5s}
.nav{display:flex;align-items:center;gap:26px}
.nav a{font-size:15px;text-decoration:none;color:var(--ash);position:relative;padding:5px 0}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:currentColor;transition:right .28s}
.nav a:hover{color:var(--bone)}.nav a:hover::after{right:0}
.nav a[aria-current]{color:var(--bone)}.nav a[aria-current]::after{right:0;background:var(--wdot,var(--ice))}
.nav .dd{position:relative}
.nav .dd-m{display:none;position:absolute;top:100%;left:-16px;min-width:310px;background:var(--void2);
  border:1px solid var(--hair);padding:7px;box-shadow:0 26px 60px rgb(0 0 0/.55)}
.nav .dd:hover .dd-m,.nav .dd:focus-within .dd-m{display:block}
.dd-m a{display:grid;grid-template-columns:62px 1fr;gap:13px;align-items:center;padding:9px}
.dd-m a::after{display:none}
.dd-m a:hover{background:var(--void3)}
.dd-m img{width:62px;height:40px;object-fit:cover}
.dd-m b{display:block;font-family:var(--disp);font-weight:400;font-size:18px;color:var(--bone)}
.lang{display:flex;gap:2px;font-family:var(--mono);font-size:10px}
.lang button{padding:5px 6px;color:var(--ash);letter-spacing:.1em}
.lang button:hover{color:var(--bone)}
.lang button[aria-pressed=true]{color:var(--void);background:var(--bone)}
.burger{display:none;width:38px;height:38px;place-items:center}
.burger span{width:19px;height:1px;background:var(--bone);box-shadow:0 -6px 0 var(--bone),0 6px 0 var(--bone)}
@media(max-width:900px){.nav{display:none}.burger{display:grid}
  .nav.open{display:flex;position:fixed;inset:60px 0 auto 0;flex-direction:column;align-items:stretch;gap:0;
    background:var(--void2);border-bottom:1px solid var(--hair);padding:6px var(--pad) 20px;z-index:44;
    max-height:calc(100dvh - 60px);overflow-y:auto;overscroll-behavior:contain}
  .nav.open a{padding:15px 0;border-bottom:1px solid var(--hair);font-size:18px;font-family:var(--disp)}
  .nav.open a::after{display:none}
  .nav.open .dd-m{display:block;position:static;min-width:0;border:0;box-shadow:none;padding:0 0 0 12px;background:none}}

/* ══ РАЗВОРОТ: два мира и имя на шве ══ */
.spread{position:relative;height:clamp(460px,78vh,780px);display:grid;
  grid-template-columns:var(--seam) calc(100% - var(--seam));
  transition:grid-template-columns .7s cubic-bezier(.2,.75,.2,1)}
.pane{position:relative;overflow:hidden;text-decoration:none;display:block}
.pane>img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.75,.2,1),filter .6s}
.pane--night>img{object-position:50% 46%;filter:saturate(.94) brightness(.92)}
.pane--day>img{object-position:50% 80%;filter:saturate(1.02)}
.spread:hover .pane>img{filter:none}
.pane::after{content:"";position:absolute;inset:0;pointer-events:none}
.pane--night::after{background:linear-gradient(180deg,rgb(11 13 18/.5) 0 14%,rgb(11 13 18/0) 38%,rgb(11 13 18/.72) 66%,rgb(11 13 18/.95) 100%)}
.pane--day::after{background:linear-gradient(180deg,rgb(240 234 225/.42) 0 12%,rgb(240 234 225/0) 34% 58%,rgb(240 234 225/.62) 78%,rgb(240 234 225/.94) 100%)}
.spread .seamline{position:absolute;left:var(--seam);top:0;bottom:0;width:1px;background:var(--bone);
  opacity:.5;z-index:3;pointer-events:none;transition:left .7s cubic-bezier(.2,.75,.2,1)}
/* имя студии: одно слово, разрезанное швом */
.word{position:absolute;z-index:4;left:0;right:0;top:50%;transform:translateY(-52%);
  text-align:center;pointer-events:none;line-height:.9}
.word span{display:block;font-family:var(--disp);font-size:clamp(52px,12.2vw,178px);letter-spacing:.005em;white-space:nowrap}
.word .base{color:var(--bone)}
.word .cut{position:absolute;inset:0;color:var(--ink);clip-path:inset(0 0 0 var(--seam));transition:clip-path .7s cubic-bezier(.2,.75,.2,1)}
/* подписи в углах разворота — они же вход в игру */
.pane .tagline{position:absolute;left:var(--pad);right:var(--pad);bottom:clamp(20px,3.2vw,38px);z-index:2;
  display:grid;gap:0;justify-items:start;max-width:38ch}
.pane .gname{font-family:var(--disp);font-size:clamp(22px,2.5vw,34px);line-height:1;display:block}
.pane .gline{font-size:15px;margin-top:7px;max-width:34ch}
.pane .gst{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.pane .gst i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pane--night .tagline{color:var(--bone)}
.pane--night .gline{color:#B9C2CE}
.pane--night .gst{color:var(--ice)}
.pane--day .tagline{color:var(--ink)}
.pane--day .gline{color:#5B5265}
.pane--day .gst{color:#7A54B5}
.pane .go{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:15px;
  border-bottom:1px solid currentColor;padding-bottom:3px;transition:gap .2s}
.pane:hover .go{gap:13px}
@media(hover:hover){
  .spread:has(.pane--night:hover){--seam:58%}
  .spread:has(.pane--day:hover){--seam:42%}
}
@media(max-width:820px){
  /* на телефоне подпись выходит из-под картинки и ложится на грунт своего мира:
     поверх кадра высотой в пол-экрана её всё равно не прочитать */
  .spread{height:auto;grid-template-columns:1fr}
  .spread .seamline{display:none}
  .pane{display:block}
  .pane>img{height:58vw;width:100%}
  .pane::after{inset:0 0 auto 0;height:58vw}
  .pane--night{background:var(--void)}
  .pane--day{background:var(--bone)}
  .pane .tagline{position:static;padding:clamp(18px,5vw,26px) var(--pad) clamp(24px,6vw,32px);
    margin:0;max-width:none;inset:auto}
  .pane .gname{font-size:clamp(28px,7.6vw,38px)}
  .word{position:static;transform:none;padding:clamp(28px,8vw,44px) var(--pad) 0;text-align:left}
  .word span{font-size:clamp(46px,14vw,86px)}
  .word .cut{display:none}
}

/* строка под разворотом */
.spec{border-bottom:1px solid var(--hair);padding:16px 0}
.spec .wrap{display:flex;gap:10px 30px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.spec ul{list-style:none;display:flex;gap:10px 26px;flex-wrap:wrap;margin:0;padding:0}
.spec li{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.spec li::before{content:"·";color:var(--slate);margin-right:26px}
.spec li:first-child::before{content:"";margin:0}

/* ══ общие секции ══ */
.sec{padding:clamp(52px,7vw,116px) 0}
.sec + .sec{border-top:1px solid var(--hair)}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.sec h2{font-family:var(--disp);font-size:clamp(32px,5vw,70px);line-height:.98;margin-top:12px}
.lede{font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:var(--ash);max-width:54ch;margin-top:20px}
.lede b{color:var(--bone);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(26px,4vw,64px)}
@media(max-width:880px){.two{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-size:15px;font-weight:600;
  text-decoration:none;color:var(--void);background:var(--bone);border:1px solid var(--bone);
  transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--bone)}
.btn--ghost{background:transparent;color:var(--bone);border-color:var(--slate)}
.btn--ghost:hover{background:var(--bone);color:var(--void);border-color:var(--bone)}
.btn svg{width:17px;height:17px}
.lnk{font-size:15px;text-decoration:none;color:var(--ash);display:inline-flex;gap:8px;align-items:center}
.lnk:hover{color:var(--bone)}
.lnk::after{content:"→";transition:transform .2s}
.lnk:hover::after{transform:translateX(4px)}

/* ══ полоса игры: кадр во всю ширину, имя дидоной ══ */
.band{position:relative;overflow:hidden;text-decoration:none;display:block;isolation:isolate}
.band>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;z-index:-2;
  transition:transform 1.2s cubic-bezier(.2,.75,.2,1)}
.band:hover>img{transform:scale(1.035)}
.band::before{content:"";position:absolute;inset:0;z-index:-1}
.band--night::before{background:linear-gradient(90deg,rgb(11 13 18/.94) 0 26%,rgb(11 13 18/.62) 54%,rgb(11 13 18/.2) 100%)}
.band--day>img{object-position:50% 96%}
.band--day::before{background:linear-gradient(90deg,rgb(240 234 225/.95) 0 30%,rgb(240 234 225/.58) 58%,rgb(240 234 225/.1) 100%)}
.band .wrap{min-height:clamp(340px,44vw,540px);display:flex;flex-direction:column;justify-content:center;
  padding-top:clamp(36px,5vw,64px);padding-bottom:clamp(36px,5vw,64px)}
.band .inner{max-width:min(56ch,64%)}
@media(max-width:820px){.band .inner{max-width:none}
  .band--night::before{background:linear-gradient(180deg,rgb(11 13 18/.5) 0 30%,rgb(11 13 18/.93) 72%)}
  .band--day::before{background:linear-gradient(180deg,rgb(240 234 225/.42) 0 30%,rgb(240 234 225/.94) 72%)}
  .band .wrap{justify-content:flex-end;min-height:clamp(420px,88vw,560px)}}
.band h3{font-family:var(--disp);font-size:clamp(34px,4.9vw,72px);line-height:.96;text-wrap:balance}
.band .one{font-size:clamp(16px,1.5vw,19px);margin-top:16px;max-width:42ch}
.band .meta{display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;margin-top:20px}
.band .st{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase}
.band .st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.band .news{font-size:14.5px}
.band .more{margin-top:26px;display:inline-flex;align-items:center;gap:9px;font-size:16px;
  border-bottom:1px solid currentColor;padding-bottom:3px}
.band--night{color:var(--bone)}.band--night .one,.band--night .news{color:#B9C2CE}.band--night .st{color:var(--ice)}
.band--day{color:var(--ink)}.band--day .one,.band--day .news{color:#5B5265}.band--day .st{color:#7A54B5}

/* ══ студия ══ */
.craft{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--hair);
  border:1px solid var(--hair);margin-top:clamp(28px,4vw,46px)}
.craft>div{background:var(--void);padding:22px 24px 26px}
.craft b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ice);margin-bottom:9px}
.craft span{color:var(--ash);font-size:15.5px}
.reel{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:clamp(24px,4vw,52px);align-items:center}
/* пара роликов в ряд: постер узкий, подпись рядом */
.reels{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3.4vw,44px);margin-top:clamp(34px,4.6vw,64px)}
.reels .reel{margin:0;grid-template-columns:minmax(0,40%) 1fr;gap:clamp(14px,1.9vw,26px)}
.reels .reel figcaption{display:grid;gap:6px}
.reels .reel b{font-family:var(--disp);font-weight:400;font-size:clamp(21px,2.2vw,29px);line-height:1}
.reels .reel .cap{color:var(--ash);font-size:15px;line-height:1.5}
.reels .reel .play i{width:54px;height:54px}
.reels .reel .play i::after{border-left-width:13px;border-top-width:8px;border-bottom-width:8px}
.reels--one{grid-template-columns:1fr;margin-top:0;max-width:320px}
.reels--one .reel{grid-template-columns:1fr}
.reels--one .reel figcaption{display:none}
@media(max-width:820px){.reels{grid-template-columns:1fr;gap:26px}}
@media(max-width:760px){.reel{grid-template-columns:1fr}}
.reel button{position:relative;overflow:hidden;background:#000;aspect-ratio:9/16;max-width:320px;width:100%}
.reel button img{width:100%;height:100%;object-fit:cover;opacity:.86;transition:opacity .3s,transform 1s}
.reel button:hover img{opacity:1;transform:scale(1.03)}
.reel .play{position:absolute;inset:0;display:grid;place-items:center}
.reel .play i{width:64px;height:64px;border-radius:50%;border:1px solid var(--bone);display:grid;place-items:center;
  background:rgb(11 13 18/.42);backdrop-filter:blur(3px)}
.reel .play i::after{content:"";border-left:16px solid var(--bone);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}

/* ══ страница игры ══ */
.ghero{position:relative;height:clamp(320px,50vw,640px);overflow:hidden;isolation:isolate}
.ghero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.ghero::before{content:"";position:absolute;inset:0;z-index:-1}
.ghero .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:clamp(22px,3.4vw,48px)}
.ghero h1{font-family:var(--disp);font-size:clamp(46px,9vw,148px);line-height:.9}
.ghero .back{font-size:15px;text-decoration:none;margin-bottom:14px;opacity:.85}
.ghero--night{color:var(--bone)}
.ghero--night::before{background:linear-gradient(180deg,rgb(11 13 18/.5) 0 22%,transparent 48%,rgb(11 13 18/.9) 100%)}
.ghero--day{color:var(--ink)}
.ghero--day>img{object-position:50% 50%}
.ghero--day::before{background:linear-gradient(180deg,rgb(240 234 225/.4) 0 22%,transparent 46%,rgb(240 234 225/.92) 100%)}

.sheet{background:var(--bone);color:var(--ink)}
.sheet .kick{color:#7A6F80}
.sheet .lede{color:#4C4453}
.sheet .lede b{color:var(--ink)}
.sheet .sec + .sec{border-top-color:#DED5C9}
.sheet .btn{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.sheet .btn:hover{background:transparent;color:var(--ink)}
.sheet .btn--ghost{background:transparent;color:var(--ink);border-color:#C9BEB0}
.sheet .btn--ghost:hover{background:var(--ink);color:var(--bone)}
.sheet .lnk{color:#7A6F80}.sheet .lnk:hover{color:var(--ink)}
.sheet .facts>div{border-color:#DED5C9}
.sheet .facts b{color:#8A7F92}
.dark{background:var(--void);color:var(--bone)}

/* ── БЛОК «ОТ АВТОРА» — узкая колонка, крупный кегль, подпись на полях ── */
.note{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:clamp(26px,4vw,64px)}
@media(min-width:881px){.note>div:first-child{position:sticky;top:84px;align-self:start}}
@media(max-width:880px){.note{grid-template-columns:1fr}}
.note .body p{font-size:clamp(18px,1.65vw,21.5px);line-height:1.6;color:#C3CAD4;max-width:58ch;margin:0}
.note .body p + p{margin-top:18px}

  tr_route_e:"Маршрут // 10 биомов, 100 миссий", tr_route_h:"От пустошей до цитадели", tr_lore:"Читать бортжурнал →",
  tr_biomes:["ПОДСТУПЫ","МЁРТВЫЙ ЛЕС","НИЖЕ НУЛЯ","ТОКСИЧНАЯ ЗОНА","ПЕПЕЛИЩЕ","МЁРТВЫЙ МЕГАПОЛИС","РАДИОАКТИВНАЯ ПУСТОШЬ","ЗАТОПЛЕННАЯ ЗОНА","КЛАДБИЩЕ МАШИН","ЛЕДЯНАЯ ЦИТАДЕЛЬ"],
  tr_ai_e:"Производство // ИИ", tr_ai_h:"Игра про ИИ, сделанная ИИ",
  tr_ai_p:"Мир игры — про машины, которые доигрывают войну без людей. Сама она собрана так же: код, арт, звук, баланс и тексты сделал искусственный интеллект, человек ставил задачу и решал, что идёт в релиз.",
  // страница котов — {{CAT_COPY}}
  ct_genre:"Уютная головоломка · merge с физикой · без таймеров",
  ct_tag:"Роняешь кота в стакан. Два кота одного уровня коснулись — получился один, покрупнее; всего одиннадцать уровней, от Котёнка до Царь-Кота, и два Царь-Кота при встрече схлопываются насовсем. <b>Двенадцать арен со своим норовом, дом на пять комнат, Котокафе с десятью заданиями и история в пять глав.</b>",
  ct_cta:"Попробовать в браузере", ct_cta2:"Сообщить о выходе", ct_st:"Статус: в разработке · цель — Google Play и App Store · русский и английский",
  ct_shots_e:"Фотоальбом", ct_shots_h:"Снимки из дома и с арен",
  ct_own_e:"Что внутри", ct_own_h:"Арены, дом и каждый день",
  ct_pillars:[["Двенадцать арен","На Склоне всё скатывается к одной стенке. Кратер сводит котов в центр, Качели мерно качают стакан, круг за девять секунд, Сквозняк сдувает мелких, а в Проруби люк то открыт, то закрыт.","cat_play_02_slope.jpg"],["Дом","Пять комнат и двадцать предметов; весь дом стоит тридцать восемь лапок. Купил лежанку — на неё въезжает выращенный кот и остаётся жить: спит, ходит к мебели, отзывается на поглаживание. Никто не съезжает.","cat_house_7_roomdone.jpg"],["Каждый день","Три задачи на сутки и общее для всех испытание: арену и очередь котов задаёт дата. Пропустил — серия простит один раз.","cat_tasks.jpg"]],
  ct_anti_h:"Чего здесь нет", ct_anti:["Рекламы посреди партии и рекламы за награду","Энергии и таймеров ожидания","Обязательного интернета: играть можно без сети","Валют, которые продаются за деньги"],
  ct_reel_e:"Запись · 21 секунда", ct_reel_h:"Как это играется",
  ct_reel_cap:"Качели кренят стакан, дом обживается, партия идёт своим ходом. Записано в игре, без звука.",
  ct_notify_e:"Когда выйдет", ct_notify_h:"Напишем один раз", ct_notify_p:"В день выхода. Больше ничего.",
  // о студии
  ab_e:"О студии", ab_h:"Эксперимент в открытую",
  ab_p:"Dido Games — эксперимент с одним вопросом: докуда сегодня дотягивает человек, который делает игру вместе с искусственным интеллектом. Ответ видно по играм. «Поезд Последней Войны» вышел в сентябре в Google Play и App Store, «ШароКоты» делаются сейчас.",
  ab_why_h:"Что здесь проверяется", ab_why_p:"Инструменты обновляются каждые несколько месяцев, и вместе с ними меняется, что вообще реально собрать и за какой срок. По играм это видно напрямую: что было недостижимо год назад и где потолок сегодня. Игроку от этого ни холодно ни жарко. Игра либо хорошая, либо нет.",
  ab_roles:[["Условия эксперимента",["Обе игры собраны так от первой строки кода до последней иконки","Сборка, которая не понравилась на телефоне, дальше не идёт","В описании игры только то, что уже работает в билде","Этот текст написан тем же способом"]]],
  tl_lede:"В хронику попадает то, что вышло, а не то, что запланировано. Студия младше своих игр: сначала появились они, потом название.", ab_tl_h:"Хроника",
  ab_tl:[["2026 · лето","Сайт и закрытый тест","Поднят didogames.net; «Поезд» уходит в закрытый тест Google Play."],["2026 · сентябрь","«Поезд Последней Войны» вышел","Опубликован в Google Play. Бесплатно, Android, десять языков."],["2026 · 25 сентября","Релиз на iPhone","«Поезд» появился в App Store — бесплатно, на iOS 17.0 и новее."],["2026 · сентябрь","«ШароКоты» в работе","Вторая игра: merge с физикой и котами. Русский и английский, цель — Google Play и App Store."]],
  ab_contact_h:"Связаться", ab_contact_p:"Одна почта на всё: поддержка, пресса, партнёрства.",
  // поддержка
  su_h:"Поддержка", su_sub:"Выберите игру — под ней почта и ответы на то, что ломается чаще всего.",
  su_tr:[["Написать в поддержку","mail"],["Вылеты и сбои","train-faq"],["Прогресс и его удаление","train-data"],["Покупки и возвраты","train-pay"]],
  su_ct:[["Написать в поддержку","mail"],["Сеть и сохранения","cat-offline"],["Когда выйдет","cat-when"]],
  su_also_h:"См. также", su_also:[["Политика конфиденциальности","что храним и зачем"],["Условия использования","правила пользования сайтом и играми"],["Пресс-кит","логотипы, кадры, факты"]],
  su_qa:[["train-faq","«Поезд Последней Войны» · частые вопросы","Игра не запускается или вылетает","Сначала обновите игру и перезапустите телефон: этим лечится большинство вылетов. Если не помогло — напишите нам модель телефона и версию системы, Android или iOS: без них сбой не воспроизвести."],["train-data","«Поезд Последней Войны» · прогресс и его удаление","Где лежит прогресс и как его стереть","Прогресс хранится на самом устройстве — учётных записей мы не ведём. Стереть его можно, удалив приложение: вместе с ним уходит всё. Напишите на почту, если нужно стереть саму переписку с поддержкой, — сотрём и ответим, что готово."],["train-pay","«Поезд Последней Войны» · покупки и возвраты","Покупка не пришла","Покупку обрабатывает магазин: на Android — Google Play, на iPhone — App Store. Если деньги списаны, а товар не пришёл, откройте в игре «Ресурсы» и нажмите «Восстановить покупки», затем перезапустите игру. Возврат оформляет сам магазин по своим правилам: в App Store — через reportaproblem.apple.com, в Google Play — через историю заказов. К вашим платёжным данным у нас доступа нет."],["cat-offline","«ШароКоты» · игра без сети","Нужен ли интернет и где сохранение","Интернет не нужен: партии, дом и задачи считаются на телефоне, там же лежит прогресс. Облачного сохранения нет, так что на новом телефоне дом придётся обставлять заново."],["cat-when","«ШароКоты» · когда выйдет","Даты пока нет","Игра в разработке. Оставьте почту на её странице — напишем один раз, когда она появится в магазине."]],

  pr_h:"Пресс-кит", pr_sub:"Факты, ключевой арт и кадры. Берите в публикацию без запроса.",
  pr_facts:[["Студия","Dido Games, 2026"],["Производство","задачу ставит человек, игру делает ИИ"],["Игры","«Поезд Последней Войны» — вышла; «ШароКоты» — в разработке"],["Платформы","Android (Google Play) и iOS (App Store)"],["Языки","«Поезд» — десять; «ШароКоты» — русский и английский"],["Контакт","support@didogames.net"]],
  pr_kits_h:"Пресс-киты игр", pr_kit_tr:"Ключевой арт, кадры, ролик на 70 секунд и факт-лист, сверенный с кодом.", pr_kit_ct:"Промо-арт, кадры, иконка. Пополняется по ходу разработки.",
  pr_dl:["Знак студии · SVG и PNG","Ключевой арт","Кадры","Факт-лист"],

  legal_priv:"Политика конфиденциальности", legal_terms:"Условия использования", legal_stub:"Текст не меняется: он синхронен с LegalDocs.gd в игре. Адрес прежний.",

  gs_e:"Как делаются эти игры", gs_h:"Игру собрал ИИ, человек принял", gs_p:"Вторую делают так же. В этом и состоит эксперимент.", gs_more:"О студии",
  back:"← Все игры", a_menu:"Меню", a_lang:"Язык сайта", a_close:"Закрыть", a_shot:"Кадр из игры", a_reel:"Ролик",
  press_link:"Пресс-кит →",
  // формы
  f_h:"Сообщить о выходе «ШароКотов»", f_sub:"Одно письмо в день выхода. Больше ничего.", f_email:"Почта", f_name:"Как к вам обращаться", f_plat:"Платформа", f_web:"Браузер", f_game:"Игра", f_game_train:"«Поезд Последней Войны» — версия для iOS", f_note:"Адрес нужен только для этого письма.", f_send:"Отправить", f_ok:"Заявка принята", f_ok2:"Напишем один раз — в день выхода.", p_go:"Загрузить и играть",
  ab_p2:"Игры для этого нарочно непохожи. В одной бронепоезд держит рубеж, пока техника пикирует с неба. В другой коты сливаются в стакане, а между партиями игрок обустраивает их дом. Если способ работает, он обязан работать в обеих.",
  tl_e:"что уже вышло",
  au_e:"От автора",
  au_h:"Зачем мне это",
  au_p:["Я продюсер игровых проектов и больше десяти лет работаю в разработке игр. За это время успел увидеть, как меняются команды, процессы, инструменты и сама индустрия. Я продолжаю внимательно следить за тем, куда всё движется, и много играю сам — не только по работе.","Этот проект для меня одновременно эксперимент, способ учиться и личное хобби. Мне всегда нравилось создавать игры, но сейчас особенно интересно исследовать сам процесс их производства: какие задачи уже можно передать современным инструментам, что действительно удаётся автоматизировать, а где технологии пока только обещают больше, чем способны дать.","Ближайшая аналогия — Factorio, только завод здесь строится внутри игровой разработки.","Сначала появляется один инструмент, который решает конкретную задачу. Затем к нему подключается следующий. Постепенно отдельные этапы складываются в цепочку, ручной работы становится меньше, а внимание переключается на поиск узких мест и улучшение самого процесса.","По сути, я пытаюсь построить такую производственную линию для создания игр — понять, насколько далеко её можно автоматизировать, не потеряв при этом качество, контроль и творческую составляющую.","А игра — это продукт, который в итоге сходит с этой линии."],
  au_sign:"Автор проекта · Dido Games",
  tr_cta_ios:"Скачать · App Store",
},
en:{
  nav_games:"Games", nav_about:"Studio", nav_support:"Support", nav_press:"Press",
  mockbar:"Mockup · the spread",
  tr_name:"The Last War: Train", ct_name:"Ball Cats",
  tr_one:"The turrets aim themselves. You catch crystals and pick a card at every rank.", ct_one:"Cats drop, merge, and move into the house you furnished.",
  tr_status:"Out now", ct_status:"In development",
  tr_news:"Since September 2026 · Android and iOS, free, ten languages", ct_news:"Twelve arenas, the house and the Cat Cafe already play",
  live:"Out · Android and iOS", dev:"In development",
  open_page:"Open",   tr_consist_e:"The consist", tr_consist_h:"The gun ladders",
  cs_loco:"Locomotive", cs_wagon:"Wagon",
  cs_loco_assault:"Assault", cs_loco_arctic:"Arctic", cs_loco_siege:"Siege", cs_loco_vault:"Vault",
  cs_w_cargo:"Cargo", cs_w_assault:"Assault", cs_w_support:"Support", cs_w_heavy:"Heavy",
  cs_w_reactor:"Reactor", cs_w_harvest:"Harvester", cs_w_bulwark:"Bulwark",
  lore_stub:"Ten log entries, one per sector. The page moves over from /lore.html as is.",
  hero_e:"Studio · 2026", spec:["Two games","Made by an AI","10 languages","Android and iOS"],
  makers_a:"Makers of", makers_b:"and", watch:"Watch the reel", watch_cap:"The Last War: Train · 70 seconds",
  h_games:"The games", h_games_sub:"One is machines finishing a war with nobody left to fight; the other is a cat picking a cushion. Both were built the same way.", all_games:"All games →",
  h_how:"How the games get made", how_h:"An AI makes the games",
  how_p:"Code, art, sound, balance and text are made by AI. A person sets the task, plays the build and decides whether it goes further. Not all of it works that way: some libraries and fonts come off the shelf. And there is no neural network inside the games themselves. AI makes them; it does not run in them.",
  how_more:"About the studio →",
  how_cols:[["Code","game loop, economy, saves, shop"],["Art","backdrops, enemies, key art, icons"],["Audio","effects and music"],["Text","story, UI, localization"]],
  games_h:"Games", games_sub:"Two so far. They have almost nothing in common and were built identically: a human sets the task, an AI makes the game.",
  tr_genre:"Arcade AA-survival · dieselpunk · portrait, one-handed",
  tr_tag:"No aiming: the turrets do that. Your job is catching crystals under fire and deciding, at every rank, <b>which gun rolls onto the train and which path it takes from there.</b>",
  tr_cta:"Download · Google Play", tr_st:"Status: out now · Google Play and the App Store · free · Android 7.0+, iOS 17.0+",
  tr_reel_e:"Footage · 70 seconds", tr_reel_h:"How it plays",
  tr_reel_cap:"Combat, the harvest field, the depot, bosses. With sound.",
  tr_shots_e:"HQ archive", tr_shots_h:"Screens",
  tr_what_e:"Mode // AA-survival", tr_what_h:"What this game is",
  tr_rows:[["A wave","ten machines come in from above, one after another"],["Loop","shoot down → rank up → pick a card → next wave"],["Run","one mission of ten waves, the last one is a boss"],["Between runs","the depot and the node tree, paid in crystals"]],
  tr_anti_h:"What you won\'t find", tr_anti:["A fee per run","Energy or wait timers","Forced internet: the campaign plays offline","Ads in the middle of a fight — rewarded only, always your call"],
  tr_cards_e:"Progression // card draft", tr_cards_h:"The gun ladders",
  tr_cards_p:"A run is one mission. Kills raise your rank, and every rank freezes the fight: three cards, keep one. Nine guns of five tiers each, a three-way fork at tier three inside the gun\'s own element, and four links that ignite on their own the moment you hold both halves.",
  tr_route_e:"The route // 10 biomes, 100 missions", tr_route_h:"From the wastes to the citadel", tr_lore:"Read the driver\'s log →",
  tr_biomes:["THE APPROACHES","DEAD FOREST","SUB-ZERO","TOXIC ZONE","THE ASHLANDS","DEAD METROPOLIS","RADIOACTIVE WASTES","FLOODED ZONE","MACHINE GRAVEYARD","ICE CITADEL"],
  tr_ai_e:"Production // AI", tr_ai_h:"Machines made the game about machines",
  tr_ai_p:"The world of the game is machines carrying on a war with no people left in it. The game itself was built along those lines: an AI wrote the code, drew the art, made the audio, tuned the balance and wrote every line of text, and a human set the task and decided what shipped.",
  ct_genre:"Cozy puzzle · physics merge · no timers",
  ct_tag:"Drop a cat into the jar. Two cats of the same level touch and become one bigger cat; eleven levels in all, Kitten up to King Cat, and two King Cats cancel each other out for good. <b>Twelve arenas with their own tempers, a five-room house, a Cat Cafe with ten jobs, and a story in five chapters.</b>",
  ct_cta:"Try in the browser", ct_cta2:"Notify me at launch", ct_st:"Status: in development · headed for Google Play and the App Store · Russian and English",
  ct_shots_e:"Photo album", ct_shots_h:"Shots from the house and the arenas",
  ct_own_e:"What\'s inside", ct_own_h:"Arenas, the house, every day",
  ct_pillars:[["Twelve arenas","On the Slope everything rolls into one wall. The Crater herds cats to the middle, the Swing rocks the jar side to side, a full sway every nine seconds, the Draft blows the small ones off, and the Ice Hole opens and shuts.","cat_play_02_slope.jpg"],["The house","Five rooms and twenty pieces of furniture; the whole house costs thirty-eight paws. Buy a bed and a cat you raised moves in for good: sleeps, wanders over to the furniture, leans into a stroke.","cat_house_7_roomdone.jpg"],["Every day","Three tasks a day, plus one challenge everybody shares — the arena and the order of cats come from the date. Miss a day and the streak forgives you once.","cat_tasks.jpg"]],
  ct_anti_h:"What\'s not here", ct_anti:["Ads mid-match, or ads for rewards","Energy or wait timers","Forced internet: it plays offline","Currencies you can buy with money"],
  ct_reel_e:"Footage · 21 seconds", ct_reel_h:"How it plays",
  ct_reel_cap:"The Swing tilts the jar, the house fills up, a run plays out. Captured in game, no sound.",
  ct_notify_e:"When it\'s out", ct_notify_h:"We\'ll tell you", ct_notify_p:"One email on launch day. Nothing else.",
  ab_e:"About the studio", ab_h:"An experiment in plain sight",
  ab_p:"Dido Games runs on one question: how much can a person actually build with AI today. The games are the answer. The Last War: Train reached Google Play and the App Store in September, and Ball Cats is in development now.",
  ab_why_h:"What is being tested", ab_why_p:"Tools turn over every few months, and what can be built, and how fast, turns over with them. The games show it directly: what was out of reach last year, where the ceiling sits now. To a player none of that matters. The game is either good or it is not.",
  ab_roles:[["Terms of the experiment",["Both games were built this way, from the first line of code to the last icon","A build that is no fun on a phone does not go out","The store page lists only what already works in the build","This text was written the same way"]]],
  tl_lede:"The timeline records what shipped, not what was planned. The studio is younger than its games: they came first, the name after.", ab_tl_h:"Timeline",
  ab_tl:[["2026 · summer","Site up, closed test running","didogames.net goes live; Train enters its closed test on Google Play."],["2026 · September","The Last War: Train ships","Published on Google Play. Free, Android, ten languages."],["2026 · 25 September","Now on iPhone","Train appeared in the App Store — free, on iOS 17.0 and up."],["2026 · September","Ball Cats in the works","The second game: a physics merge with cats. Russian and English; Google Play and the App Store are the target."]],
  ab_contact_h:"Contact", ab_contact_p:"One address for all of it: support, press, partnerships.",
  su_h:"Support", su_sub:"Pick your game — under it sit the email and answers to what breaks most.",
  su_tr:[["Email support","mail"],["Crashes and startup","train-faq"],["Progress and deleting it","train-data"],["Purchases and refunds","train-pay"]],
  su_ct:[["Email support","mail"],["Offline play and saves","cat-offline"],["When it comes out","cat-when"]],
  su_also_h:"See also", su_also:[["Privacy policy","what we store and why"],["Terms of use","the rules for the site and the games"],["Press kit","logos, screens, facts"]],
  su_qa:[["train-faq","The Last War: Train · frequent questions","The game won't start, or it crashes","Update the game and restart the phone first: that clears most crashes. If it keeps happening, send us your phone model and system version, Android or iOS — without them the crash cannot be reproduced here."],["train-data","The Last War: Train · progress and deleting it","Where progress is kept and how to wipe it","Progress sits on the device itself; we keep no accounts. Wipe it by uninstalling the app — everything goes with it. Write to support if you want the support thread itself deleted, and we will confirm when it is done."],["train-pay","The Last War: Train · purchases and refunds","A purchase did not arrive","The store handles the purchase: Google Play on Android, the App Store on iPhone. If you were charged and nothing arrived, open Resources in the game, tap Restore purchases, then restart the game. Refunds are issued by the store under its own rules: reportaproblem.apple.com for the App Store, order history for Google Play. We have no access to your payment details."],["cat-offline","Ball Cats · playing offline","Do you need internet, and where are saves kept","No internet needed: runs, the house and the tasks all run on the phone, and the progress lives there too. There is no cloud save, so a new phone means furnishing the house again."],["cat-when","Ball Cats · when it comes out","No date yet","The game is in development. Leave your email on its page and we will write once, when it reaches the store."]],

        <span class="wm" style="font-family:var(--disp);font-size:clamp(34px,4vw,56px);color:var(--bone);display:inline-flex;align-items:baseline;gap:10px">Dido Games<i style="width:9px;height:9px;background:var(--ice);border-radius:50%;transform:translateY(-6px)"></i></span></div>
    </div>
      <h2 style="font-size:clamp(24px,3vw,38px);margin-top:clamp(34px,4.6vw,64px)">${t("pr_kits_h")}</h2>
      <div class="kit" style="margin-top:20px">
        <a href="#/games/train/press"><img src="/img/train_cover.jpg" alt=""><div class="b"><h3>${t("tr_name")}</h3><p>${t("pr_kit_tr")}</p></div></a>
        <a href="#/games/sharokoty/press"><img src="/img/cat_cover.jpg" alt=""><div class="b"><h3>${t("ct_name")}</h3><p>${t("pr_kit_ct")}</p></div></a>
      </div>
    </div></section>
    ${footer()}</div>`,
};

const STUB = (key, note) => () => `<div class="w-studio">${header("")}
  <section class="sec"><div class="wrap"><div class="kick">didogames.net</div>
    <h2 style="font-size:clamp(30px,5vw,64px)">${t(key)}</h2>
    <p class="lede">${t(note || "legal_stub")}</p>
  </div></section>${footer()}</div>`;
// старые адреса-хэши уводим на канонические документы
PAGES["/privacy"] = () => { location.replace("privacy.html"); return ""; };
PAGES["/terms"] = () => { location.replace("terms.html"); return ""; };
PAGES["/games/train/lore"] = () => `<div class="w-train">${header("games")}
  <section class="sec"><div class="wrap"><a class="lnk" href="#/games/train" style="color:var(--ice)">${t("tr_name")}</a>
    <h2 style="font-size:clamp(30px,5.4vw,70px);margin-top:16px">${t("tr_route_h")}</h2>
    <p class="lede">${t("lore_stub")}</p>
  </div></section>${footer()}</div>`;
const pressStub = g => () => `<div class="w-studio">${header("press")}
  <section class="sec"><div class="wrap"><a class="lnk" href="#/games/${g.id}" style="color:${g.dot}">${t(g.key + "_name")}</a>
    <h2 style="font-size:clamp(30px,5.4vw,70px);margin-top:16px">${t("pr_h")}</h2>
    <p class="lede">${t(g.id === "train" ? "pr_kit_tr" : "pr_kit_ct")}</p>
    <div class="dl">${t("pr_dl").map(x => `<span>${x}</span>`).join("")}</div>
  </div></section>${footer()}</div>`;
PAGES["/games/train/press"] = pressStub(GAMES[0]);
PAGES["/games/sharokoty/press"] = pressStub(GAMES[1]);

/* ═══════════════ МАРШРУТ ═══════════════ */
const ANCHOR_PAGE = { studio: "/" };   // якоря, живущие не на странице поддержки
const DOT_OF = { "/games/train": "var(--ice)", "/games/train/lore": "var(--ice)", "/games/train/press": "var(--ice)",
                 "/games/sharokoty": "var(--lilac)", "/games/sharokoty/press": "var(--lilac)" };
function draw(html, dot) {
  document.getElementById("app").innerHTML = html;
  document.documentElement.style.setProperty("--wdot", dot || "var(--ice)");
  document.documentElement.lang = lang;
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1")   // только предпросмотр
    document.querySelectorAll('#app img[src^="/img/"]').forEach(i => i.src = i.getAttribute("src").split("?")[0] + "?v=" + IMGV);
  document.querySelectorAll("[data-i]").forEach(el => { const k = el.dataset.i; if (T[lang][k] !== undefined) el.textContent = T[lang][k]; });
  document.querySelectorAll("[data-i-aria]").forEach(el => { const k = el.dataset.iAria; if (T[lang][k] !== undefined) el.setAttribute("aria-label", T[lang][k]); });
}
function route() {
  const raw = location.hash.replace(/^#/, "");
  if (raw && !raw.startsWith("/")) {                 // якорь внутри страницы, а не маршрут
    if (!document.getElementById(raw)) draw((PAGES[ANCHOR_PAGE[raw] || "/support"])());
    document.getElementById(raw)?.scrollIntoView();
    return;
  }
  const path = (raw || "/").replace(/\/$/, "") || "/";
  draw((PAGES[path] || PAGES["/"])(), DOT_OF[path]);
  window.scrollTo({ top: 0, left: 0, behavior: "instant" });
}

/* ═══════════════ ПОВЕДЕНИЕ ═══════════════ */
let lastFocus = null;
const FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,video,[tabindex]:not([tabindex="-1"])';
function toggleNav() { const n = document.getElementById("nav"), b = document.querySelector("[data-burger]");
  const on = n.classList.toggle("open"); if (b) b.setAttribute("aria-expanded", String(on)); }
function closeNav() { const n = document.getElementById("nav"), b = document.querySelector("[data-burger]");
  if (n) n.classList.remove("open"); if (b) b.setAttribute("aria-expanded", "false"); }
function openDlg(el, label) {
  lastFocus = document.activeElement;
  if (label) el.setAttribute("aria-label", label);
  el.classList.add("on");
  document.getElementById("app").setAttribute("inert", "");
  el.querySelector(FOCUSABLE)?.focus();
}
function openLB(html, label) { document.getElementById("lbc").innerHTML = html; openDlg(document.getElementById("lb"), label); }
function closeAll() {
  document.querySelectorAll(".lb.on,.modal.on").forEach(x => x.classList.remove("on"));
  document.getElementById("lbc").innerHTML = "";
  document.getElementById("app").removeAttribute("inert");
  if (lastFocus && lastFocus.isConnected) lastFocus.focus(); lastFocus = null;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (b) { const want = b.dataset.lang === "en" ? "/en/" : "/";
    if ((b.dataset.lang === "en") !== EN_PATH) { location.href = want + location.hash; return; }
    return; }
  if (e.target.closest("[data-burger]")) { toggleNav(); return; }
  if (e.target.closest("#nav a")) closeNav();
  const v = e.target.closest("[data-video]");
  if (v) { const r = REELS[v.dataset.video || "train"];
    openLB(`<video src="${r.src}" controls autoplay playsinline poster="${r.poster}" style="aspect-ratio:9/16;max-height:78vh"></video><p class="lbcap">${t(r.cap)}</p>`, t("a_reel")); return; }
  const s = e.target.closest("[data-lb]");
  if (s) { openLB(`<img src="${s.dataset.lb}" alt="${t("a_shot")}">`, t("a_shot")); return; }
  if (e.target.closest("[data-form]")) { const m = document.getElementById("mform"); m.classList.remove("done"); openDlg(m); document.getElementById("f_email").focus(); return; }
  if (e.target.closest("[data-close]") || e.target.classList.contains("lb") || e.target.classList.contains("modal")) { closeAll(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeAll(); closeNav(); return; }
  if (e.key !== "Tab") return;
  const dlg = document.querySelector(".lb.on,.modal.on"); if (!dlg) return;
  const f = [...dlg.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null || x.tagName === "VIDEO");
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById("nform").addEventListener("submit", e => {
  e.preventDefault(); const em = document.getElementById("f_email");
  if (!em.checkValidity()) { em.reportValidity(); return; }
  const fd = new FormData();
  fd.append("entry.1602638693", em.value.trim());
  fd.append("entry.1736986761", document.getElementById("f_name").value.trim());
  // Выбора игры в форме больше нет: «Поезд» вышел на обеих платформах,
  // ждать осталось только «ШароКотов» — метка постоянная.
  fd.append("entry.1734298389", document.getElementById("f_plat").value + " · ШароКоты");
  fd.append("entry.219790479", lang);
  // CORS Google не отдаёт: ответ нам недоступен, поэтому свой экран «принято».
  try { fetch("https://docs.google.com/forms/d/e/1FAIpQLSc4Seq_tMWckJWInFR1ENVdKpDfPxTW95gESPxZvaLgVVJHmQ/formResponse", { method: "POST", mode: "no-cors", body: fd }); } catch (x) {}
  const m = document.getElementById("mform"); m.classList.add("done");
  m.querySelector(".ok").focus();
});
window.addEventListener("hashchange", route);
route();

</script>
