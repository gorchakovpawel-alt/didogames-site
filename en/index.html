<meta property="og:description" content="Dido Games: the dieselpunk AA-survival The Last War: Train, the cosy merge Ball Cats and Aeryntha, a fairy-tale island with fairies. Code, art, sound and text are made by an AI.">
<meta property="og:url" content="https://didogames.net/en/">

<link rel="icon" href="/assets/img/dg_favicon_32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/dg_touch_180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oranienbaum&family=Sofia+Sans:wght@400;500;600;700&family=Martian+Mono:wght@400;500&display=swap">
<style>

:root{
    --void:#0B0D12; --void2:#12151C; --void3:#1A1E27;
  --bone:#F0EAE1; --bone2:#FBF7F1;
  --ash:#9AA3B0; --slate:#39404D; --hair:#242A34;
  --ink:#17151A;
    --ice:#8FD8E8;          --amber:#E9B43C;        --lilac:#C8B6E2;        --moss:#6BE06B;         --disp:"Oranienbaum",Georgia,serif;
  --sans:"Sofia Sans",system-ui,-apple-system,sans-serif;
  --mono:"Martian Mono",ui-monospace,monospace;
  --w:1280px; --pad:clamp(20px,4vw,56px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px;background:var(--void)}
body{margin:0;overflow-x:clip;background:var(--void);color:var(--bone);
  font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:400;line-height:.98;overflow-wrap:break-word}
p{margin:0}
.wrap{max-width:var(--w);margin:0 auto;padding:0 var(--pad)}

.m{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;line-height:1.6}
.m--ice{color:var(--ice)}.m--dim{color:var(--ash)}
.dsp{font-family:var(--disp);font-weight:400;letter-spacing:.005em}

.hd{position:sticky;top:0;z-index:40;background:color-mix(in oklab,var(--void) 86%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--hair)}
.hd .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:18px}
.mark{display:flex;align-items:baseline;gap:9px;text-decoration:none;font-family:var(--disp);
  font-size:clamp(19px,4.6vw,23px);letter-spacing:.01em;color:var(--bone);white-space:nowrap}
.mark i{width:7px;height:7px;background:var(--wdot,var(--bone));border-radius:50%;transform:translateY(-3px);transition:background .5s}
.nav{display:flex;align-items:center;gap:26px}
.nav a{font-size:15px;text-decoration:none;color:var(--ash);position:relative;padding:5px 0}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:2px;height:1px;background:currentColor;transition:right .28s}
.nav a:hover{color:var(--bone)}.nav a:hover::after{right:0}
.nav a[aria-current]{color:var(--bone)}.nav a[aria-current]::after{right:0;background:var(--wdot,var(--bone))}
.nav .dd{position:relative}
.nav .dd-m{display:none;position:absolute;top:100%;left:-16px;min-width:310px;background:var(--void2);
  border:1px solid var(--hair);padding:7px;box-shadow:0 26px 60px rgb(0 0 0/.55)}
.nav .dd:hover .dd-m,.nav .dd:focus-within .dd-m{display:block}
.dd-m a{display:grid;grid-template-columns:62px 1fr;gap:13px;align-items:center;padding:9px}
.dd-m a::after{display:none}
.dd-m a:hover{background:var(--void3)}
.dd-m img{width:62px;height:40px;object-fit:cover}
.dd-m b{display:block;font-family:var(--disp);font-weight:400;font-size:18px;color:var(--bone)}
.lang{display:flex;gap:2px;font-family:var(--mono);font-size:10px}
.lang button{padding:5px 6px;color:var(--ash);letter-spacing:.1em}
.lang button:hover{color:var(--bone)}
.lang button[aria-pressed=true]{color:var(--void);background:var(--bone)}
.burger{display:none;width:38px;height:38px;place-items:center}
.burger span{width:19px;height:1px;background:var(--bone);box-shadow:0 -6px 0 var(--bone),0 6px 0 var(--bone)}
@media(max-width:900px){.nav{display:none}.burger{display:grid}
  .nav.open{display:flex;position:fixed;inset:60px 0 auto 0;flex-direction:column;align-items:stretch;gap:0;
    background:var(--void2);border-bottom:1px solid var(--hair);padding:6px var(--pad) 20px;z-index:44;
    max-height:calc(100dvh - 60px);overflow-y:auto;overscroll-behavior:contain}
  .nav.open a{padding:15px 0;border-bottom:1px solid var(--hair);font-size:18px;font-family:var(--disp)}
  .nav.open a::after{display:none}
  .nav.open .dd-m{display:block;position:static;min-width:0;border:0;box-shadow:none;padding:0 0 0 12px;background:none}}

.cover{padding:clamp(26px,4vw,52px) 0 clamp(22px,3vw,38px)}
.masthead{font-family:var(--disp);font-weight:400;font-size:clamp(52px,9.6vw,148px);line-height:.92;
  letter-spacing:.005em;display:inline-flex;align-items:baseline;gap:.12em;white-space:nowrap}
.masthead i{width:.075em;height:.075em;border-radius:50%;background:var(--bone);transform:translateY(-.08em)}
.thesis{font-size:clamp(17px,1.6vw,21px);line-height:1.5;color:var(--ash);max-width:52ch;margin-top:clamp(14px,1.8vw,22px)}
.windows{--cols:min(var(--n),4);display:grid;gap:1px;
  grid-template-columns:repeat(auto-fill,minmax(max(280px,calc((100% - (var(--cols) - 1) * 1px) / var(--cols))),1fr))}
.win{position:relative;display:flex;flex-direction:column;text-decoration:none;
  background:var(--g-bg,var(--void2));color:var(--g-ink,var(--bone));box-shadow:0 0 0 1px var(--hair)}
.win .pic{display:block;aspect-ratio:4/3;max-height:min(46vw,max(520px,27vw));overflow:hidden;background:var(--g-bg,var(--void3))}
.win .pic img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.75,.2,1)}
.win:hover .pic img{transform:scale(1.035)}
.win .cap{display:flex;flex-direction:column;gap:7px;padding:clamp(18px,2vw,26px) clamp(18px,2vw,28px) clamp(20px,2.4vw,30px);
  border-top:3px solid var(--g-ac,var(--slate))}
.win .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.win em{font-family:var(--mono);font-style:normal;font-size:10px;letter-spacing:.14em;color:var(--g-dim,var(--ash))}
.win .row{flex-wrap:wrap;row-gap:4px}
.win .gst{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--g-ac,var(--ash))}
.win .gst i{width:6px;height:6px;border-radius:50%;background:currentColor}
.win .gname{font-family:var(--disp);font-size:clamp(25px,2.5vw,36px);line-height:1;margin-top:6px}
.win .gline{font-size:15.5px;line-height:1.45;color:var(--g-dim,var(--ash));max-width:36ch}
.win .go{margin-top:8px;font-size:15px;display:inline-flex;gap:8px;align-items:center;color:var(--g-ac,var(--bone));transition:gap .2s}
.win:hover .go{gap:13px}
.win--next{color:var(--ash)}
.win--next .pic{background:repeating-linear-gradient(135deg,var(--void2) 0 14px,var(--void3) 14px 15px)}
.win--next .gname{color:var(--slate)}
@media(max-width:620px){.win .pic{max-height:none}}
@media(min-width:561px) and (max-width:841px){.windows .win:last-child:nth-child(odd){grid-column:1/-1}
  .windows .win:last-child:nth-child(odd) .pic{aspect-ratio:21/9}}
.win .pic{position:relative}
.ctag{position:absolute;left:12px;bottom:12px;z-index:2;font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;
  text-transform:uppercase;color:#FFF3D6;background:rgb(29 42 60/.72);padding:5px 8px;pointer-events:none}
.win .ctag{color:#FFF3D6;font-size:9px}   .band .ctag{left:auto;right:12px}
@media(max-width:820px){.band--art .ctag{top:calc(75vw - 36px);bottom:auto}}   .ghero--poster{position:relative}
.ghero--poster .ctag{left:auto;right:16px;bottom:14px}


.spec{border-bottom:1px solid var(--hair);padding:16px 0}
.spec .wrap{display:flex;gap:10px 30px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.spec ul{list-style:none;display:flex;gap:10px 26px;flex-wrap:wrap;margin:0;padding:0}
.spec li{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.spec li::before{content:"·";color:var(--slate);margin-right:26px}
.spec li:first-child::before{content:"";margin:0}
@media(max-width:560px){.spec ul{gap:8px 18px}.spec li::before{content:none}}   
.sec{padding:clamp(52px,7vw,116px) 0}
.sec + .sec{border-top:1px solid var(--hair)}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ash)}
.sec h2{font-family:var(--disp);font-size:clamp(32px,5vw,70px);line-height:.98;margin-top:12px}
.lede{font-size:clamp(17px,1.5vw,20px);line-height:1.55;color:var(--ash);max-width:54ch;margin-top:20px}
.lede b{color:var(--bone);font-weight:600}
.two{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:clamp(26px,4vw,64px)}
@media(max-width:880px){.two{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-size:15px;font-weight:600;
  text-decoration:none;color:var(--void);background:var(--bone);border:1px solid var(--bone);
  transition:background .2s,color .2s}
.btn:hover{background:transparent;color:var(--bone)}
.btn--ghost{background:transparent;color:var(--bone);border-color:var(--slate)}
.btn--ghost:hover{background:var(--bone);color:var(--void);border-color:var(--bone)}
.btn svg{width:17px;height:17px}
.lnk{font-size:15px;text-decoration:none;color:var(--ash);display:inline-flex;gap:8px;align-items:center}
.lnk:hover{color:var(--bone)}
.lnk::after{content:"→";transition:transform .2s}
.lnk:hover::after{transform:translateX(4px)}

.band{position:relative;overflow:hidden;text-decoration:none;display:block;isolation:isolate}
.band>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 62%;z-index:-2;
  transition:transform 1.2s cubic-bezier(.2,.75,.2,1)}
.band:hover>img{transform:scale(1.035)}
.band::before{content:"";position:absolute;inset:0;z-index:-1}
.band--night::before{background:linear-gradient(90deg,rgb(11 13 18/.94) 0 26%,rgb(11 13 18/.62) 54%,rgb(11 13 18/.2) 100%)}
.band--day>img{object-position:50% 96%}
.band--day::before{background:linear-gradient(90deg,color-mix(in oklab,var(--g-bg,#F0EAE1) 95%,transparent) 0 30%,color-mix(in oklab,var(--g-bg,#F0EAE1) 58%,transparent) 58%,color-mix(in oklab,var(--g-bg,#F0EAE1) 10%,transparent) 100%)}
.band .wrap{min-height:clamp(340px,44vw,540px);display:flex;flex-direction:column;justify-content:center;
  padding-top:clamp(36px,5vw,64px);padding-bottom:clamp(36px,5vw,64px)}
.band .inner{max-width:min(56ch,64%)}
@media(max-width:820px){.band .inner{max-width:none}
  .band--night::before{background:linear-gradient(180deg,rgb(11 13 18/.5) 0 30%,rgb(11 13 18/.93) 72%)}
  .band--day::before{background:linear-gradient(180deg,color-mix(in oklab,var(--g-bg,#F0EAE1) 42%,transparent) 0 30%,color-mix(in oklab,var(--g-bg,#F0EAE1) 94%,transparent) 72%)}
  .band .wrap{justify-content:flex-end;min-height:clamp(420px,88vw,560px)}}
.band h3{font-family:var(--disp);font-size:clamp(34px,4.9vw,72px);line-height:.96;text-wrap:balance}
.band .one{font-size:clamp(16px,1.5vw,19px);margin-top:16px;max-width:42ch}
.band .meta{display:flex;gap:12px 22px;flex-wrap:wrap;align-items:center;margin-top:20px}
.band .st{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase}
.band .st i{width:6px;height:6px;border-radius:50%;background:currentColor}
.band .news{font-size:14.5px}
.band .more{margin-top:26px;display:inline-flex;align-items:center;gap:9px;font-size:16px;
  border-bottom:1px solid currentColor;padding-bottom:3px}
.band--night{color:var(--bone)}.band--night .one,.band--night .news{color:#B9C2CE}.band--night .st{color:var(--ice)}
.band--day{color:var(--g-ink,var(--ink))}.band--day .one,.band--day .news{color:var(--g-dim,#5B5265)}.band--day .st{color:var(--g-ac,#7A54B5)}

.craft{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hair);
  border:1px solid var(--hair);margin-top:clamp(28px,4vw,46px)}
@media(max-width:900px){.craft{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.craft{grid-template-columns:1fr}}
.craft>div{background:var(--void);padding:22px 24px 26px}
.craft b{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ice);margin-bottom:9px}
.craft span{color:var(--ash);font-size:15.5px}
.reel{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:clamp(24px,4vw,52px);align-items:center}
.reels{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3.4vw,44px);margin-top:clamp(34px,4.6vw,64px)}
.reels .reel{margin:0;grid-template-columns:minmax(0,40%) 1fr;gap:clamp(14px,1.9vw,26px)}
.reels .reel figcaption{display:grid;gap:6px}
.reels .reel b{font-family:var(--disp);font-weight:400;font-size:clamp(21px,2.2vw,29px);line-height:1}
.reels .reel .cap{color:var(--ash);font-size:15px;line-height:1.5}
.reels .reel .play i{width:54px;height:54px}
.reels .reel .play i::after{border-left-width:13px;border-top-width:8px;border-bottom-width:8px}
.reels--one{grid-template-columns:1fr;margin-top:0;max-width:320px}
.reels--one .reel{grid-template-columns:1fr}
.reels--one .reel figcaption{display:none}
@media(max-width:820px){.reels{grid-template-columns:1fr;gap:26px}}
@media(max-width:760px){.reel{grid-template-columns:1fr}}
.reel button{position:relative;overflow:hidden;background:#000;aspect-ratio:9/16;max-width:320px;width:100%}
.reel button img{width:100%;height:100%;object-fit:cover;opacity:.86;transition:opacity .3s,transform 1s}
.reel button:hover img{opacity:1;transform:scale(1.03)}
.reel .play{position:absolute;inset:0;display:grid;place-items:center}
.reel .play i{width:64px;height:64px;border-radius:50%;border:1px solid var(--bone);display:grid;place-items:center;
  background:rgb(11 13 18/.42);backdrop-filter:blur(3px)}
.reel .play i::after{content:"";border-left:16px solid var(--bone);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:5px}

.ghero{position:relative;height:clamp(320px,50vw,640px);overflow:hidden;isolation:isolate}
.ghero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.ghero::before{content:"";position:absolute;inset:0;z-index:-1}
.ghero .wrap{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;
  padding-bottom:clamp(22px,3.4vw,48px)}
.ghero h1{font-family:var(--disp);font-size:clamp(46px,9vw,148px);line-height:.9}
.ghero .back{font-size:15px;text-decoration:none;margin-bottom:14px;opacity:.85}
.ghero--night{color:var(--bone)}
.ghero--night::before{background:linear-gradient(180deg,rgb(11 13 18/.5) 0 22%,transparent 48%,rgb(11 13 18/.9) 100%)}
.ghero--day{color:var(--g-ink,var(--ink))}
.ghero--day>img{object-position:50% 50%}
.ghero--day::before{background:linear-gradient(180deg,rgb(240 234 225/.4) 0 22%,transparent 46%,rgb(240 234 225/.92) 100%)}

.sheet{background:var(--bone);color:var(--ink)}
.sheet .kick{color:#7A6F80}
.sheet .lede{color:#4C4453}
.sheet .lede b{color:var(--ink)}
.sheet .sec + .sec{border-top-color:#DED5C9}
.sheet .btn{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.sheet .btn:hover{background:transparent;color:var(--ink)}
.sheet .btn--ghost{background:transparent;color:var(--ink);border-color:#C9BEB0}
.sheet .btn--ghost:hover{background:var(--ink);color:var(--bone)}
.sheet .lnk{color:#7A6F80}.sheet .lnk:hover{color:var(--ink)}
.sheet .facts>div{border-color:#DED5C9}
.sheet .facts b{color:#8A7F92}
.dark{background:var(--void);color:var(--bone)}

.note{display:grid;grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);gap:clamp(26px,4vw,64px)}
@media(min-width:881px){.note>div:first-child{position:sticky;top:84px;align-self:start}}
@media(max-width:880px){.note{grid-template-columns:1fr}}
.note .body p{font-size:clamp(18px,1.65vw,21.5px);line-height:1.6;color:#C3CAD4;max-width:58ch;margin:0}
.note .body p + p{margin-top:18px}
.note .sign{margin-top:clamp(24px,3vw,36px);display:inline-flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash)}
.note .sign::before{content:"";width:34px;height:1px;background:var(--slate)}

.facts{border-top:1px solid var(--hair)}
.facts>div{display:grid;grid-template-columns:132px 1fr;gap:20px;padding:15px 0;border-bottom:1px solid var(--hair);font-size:16.5px}
.facts b{font-family:var(--mono);font-weight:400;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ash);padding-top:6px}
@media(max-width:560px){.facts>div{grid-template-columns:1fr;gap:4px}.facts b{padding-top:0}}

.shots{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:14px;scrollbar-width:thin}
.shots button{flex:0 0 clamp(158px,21vw,224px);scroll-snap-align:start;overflow:hidden;position:relative}
.shots img{width:100%;aspect-ratio:9/19;object-fit:cover;transition:transform .6s}
.shots button:hover img{transform:scale(1.04)}

.route{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:16px;scrollbar-width:thin}
.route figure{margin:0;flex:0 0 clamp(158px,21vw,220px);scroll-snap-align:start}
.route img{width:100%;aspect-ratio:3/4;object-fit:cover}
.route .bar{display:block;height:3px;background:var(--bio)}
.route figcaption{margin-top:10px;display:grid;gap:3px}
.route figcaption b{font-family:var(--disp);font-weight:400;font-size:19px;line-height:1}
.route figcaption em{font-family:var(--mono);font-style:normal;font-size:9px;letter-spacing:.14em;color:#8A7F92}

.room{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.room{grid-template-columns:1fr}}
.room .cell{background:var(--bone2);border:1px solid #E3DACD;overflow:hidden}
.room .cell img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 34%}
.room .cell .b{padding:18px 20px 22px}
.room h3{font-family:var(--disp);font-weight:400;font-size:24px;line-height:1;color:var(--ink)}
.room p{font-size:15.5px;color:#5B5265;margin-top:9px}
@media(max-width:900px){.room .cell{display:grid;grid-template-columns:minmax(130px,32%) 1fr}
  .room .cell img{aspect-ratio:auto;height:100%;min-height:140px}}

  au_p:["Я продюсер игровых проектов и больше десяти лет работаю в разработке игр. За это время успел увидеть, как меняются команды, процессы, инструменты и сама индустрия. Я продолжаю внимательно следить за тем, куда всё движется, и много играю сам — не только по работе.","Этот проект для меня одновременно эксперимент, способ учиться и личное хобби. Мне всегда нравилось создавать игры, но сейчас особенно интересно исследовать сам процесс их производства: какие задачи уже можно передать современным инструментам, что действительно удаётся автоматизировать, а где технологии пока только обещают больше, чем способны дать.","Ближайшая аналогия — Factorio, только завод здесь строится внутри игровой разработки.","Сначала появляется один инструмент, который решает конкретную задачу. Затем к нему подключается следующий. Постепенно отдельные этапы складываются в цепочку, ручной работы становится меньше, а внимание переключается на поиск узких мест и улучшение самого процесса.","По сути, я пытаюсь построить такую производственную линию для создания игр — понять, насколько далеко её можно автоматизировать, не потеряв при этом качество, контроль и творческую составляющую.","А игра — это продукт, который в итоге сходит с этой линии."],

/* ═══════════════ МАРШРУТ ═══════════════ */
const ANCHOR_PAGE = { studio: "/" };   // якоря, живущие не на странице поддержки
const DOT_OF = Object.fromEntries(GAMES.flatMap(g =>
  ["", "/lore", "/press"].map(s => ["/games/" + g.id + s, g.pal.dot])));
const BASE_TITLE = document.title;
const TITLES = { "/games": () => t("games_h"), "/games/train": () => t("tr_name"), "/games/sharokoty": () => t("ct_name"),
  "/games/aeryntha": () => "Aeryntha" };
function draw(html, dot, path) {
  document.title = TITLES[path] ? TITLES[path]() + " — Dido Games" : BASE_TITLE;
  document.getElementById("app").innerHTML = html;
  document.documentElement.style.setProperty("--wdot", dot || "var(--bone)");
  document.documentElement.lang = lang;
  if (location.hostname === "localhost" || location.hostname === "127.0.0.1")   // только предпросмотр
    document.querySelectorAll('#app img[src^="/img/"]').forEach(i => i.src = i.getAttribute("src").split("?")[0] + "?v=" + IMGV);
  document.querySelectorAll("[data-i]").forEach(el => { const k = el.dataset.i; if (T[lang][k] !== undefined) el.textContent = T[lang][k]; });
  document.querySelectorAll("[data-i-aria]").forEach(el => { const k = el.dataset.iAria; if (T[lang][k] !== undefined) el.setAttribute("aria-label", T[lang][k]); });
}
function route() {
  const raw = location.hash.replace(/^#/, "");
  if (raw && !raw.startsWith("/")) {                 // якорь внутри страницы, а не маршрут
    if (!document.getElementById(raw)) {
      if (!ANCHOR_PAGE[raw]) { location.replace("support.html#" + raw); return; }
      draw(PAGES[ANCHOR_PAGE[raw]]());
    }
    document.getElementById(raw)?.scrollIntoView();
    return;
  }
  const path = (raw || "/").replace(/\/$/, "") || "/";
  draw((PAGES[path] || PAGES["/"])(), DOT_OF[path], path);
  window.scrollTo({ top: 0, left: 0, behavior: "instant" });
}

/* ═══════════════ ПОВЕДЕНИЕ ═══════════════ */
let lastFocus = null;
const FOCUSABLE = 'a[href],button:not([disabled]),input,select,textarea,video,[tabindex]:not([tabindex="-1"])';
function toggleNav() { const n = document.getElementById("nav"), b = document.querySelector("[data-burger]");
  const on = n.classList.toggle("open"); if (b) b.setAttribute("aria-expanded", String(on)); }
function closeNav() { const n = document.getElementById("nav"), b = document.querySelector("[data-burger]");
  if (n) n.classList.remove("open"); if (b) b.setAttribute("aria-expanded", "false"); }
function openDlg(el, label) {
  lastFocus = document.activeElement;
  if (label) el.setAttribute("aria-label", label);
  el.classList.add("on");
  document.getElementById("app").setAttribute("inert", "");
  el.querySelector(FOCUSABLE)?.focus();
}
function openLB(html, label) { document.getElementById("lbc").innerHTML = html; openDlg(document.getElementById("lb"), label); }
function closeAll() {
  document.querySelectorAll(".lb.on,.modal.on").forEach(x => x.classList.remove("on"));
  document.getElementById("lbc").innerHTML = "";
  document.getElementById("app").removeAttribute("inert");
  if (lastFocus && lastFocus.isConnected) lastFocus.focus(); lastFocus = null;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-lang]");
  if (b) { const want = b.dataset.lang === "en" ? SITE_BASE + "en/" : SITE_BASE;
    if ((b.dataset.lang === "en") !== EN_PATH) { location.href = want + location.hash; return; }
    return; }
  if (e.target.closest("[data-burger]")) { toggleNav(); return; }
  if (e.target.closest("#nav a")) closeNav();
  const v = e.target.closest("[data-video]");
  if (v) { const r = REELS[v.dataset.video || "train"];
    openLB(`<video src="${r.src}" controls autoplay playsinline poster="${r.poster}" style="${r.wide ? "aspect-ratio:16/9;width:min(92vw,1152px)" : "aspect-ratio:9/16;max-height:78vh"}"></video><p class="lbcap">${t(r.cap)}</p>`, t("a_reel")); return; }
  const s = e.target.closest("[data-lb]");
  if (s) { const lbl = s.dataset.lbl || t("a_shot"); openLB(`<img src="${s.dataset.lb}" alt="${lbl}">`, lbl); return; }
  if (e.target.closest("[data-form]")) { const m = document.getElementById("mform"); m.classList.remove("done"); openDlg(m); document.getElementById("f_email").focus(); return; }
  if (e.target.closest("[data-close]") || e.target.classList.contains("lb") || e.target.classList.contains("modal")) { closeAll(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeAll(); closeNav(); return; }
  if (e.key !== "Tab") return;
  const dlg = document.querySelector(".lb.on,.modal.on"); if (!dlg) return;
  const f = [...dlg.querySelectorAll(FOCUSABLE)].filter(x => x.offsetParent !== null || x.tagName === "VIDEO");
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
document.getElementById("nform").addEventListener("submit", e => {
  e.preventDefault(); const em = document.getElementById("f_email");
  if (!em.checkValidity()) { em.reportValidity(); return; }
  const fd = new FormData();
  fd.append("entry.1602638693", em.value.trim());
  fd.append("entry.1736986761", document.getElementById("f_name").value.trim());
